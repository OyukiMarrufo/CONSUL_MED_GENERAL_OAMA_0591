<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expediente Clínico - CONSUL-MED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Módulo: Expediente Clínico Histórico</h4>
                    </div>
                    <div class="card-body">
                        <form action="/expediente/registrar" method="POST">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label">ID o Nombre del Paciente</label>
                                    <input type="text" name="id_paciente" class="form-control" required placeholder="Ej. P-001 o Ana Karen Garcia">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Signos Vitales</label>
                                    <input type="text" name="signos_vitales" class="form-control" required placeholder="Ej. 120/80 mmHg, 36.5°C, 72 lpm">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Diagnóstico Clínico</label>
                                    <textarea name="diagnostico" class="form-control" rows="3" required placeholder="Describa el diagnóstico actual del paciente..."></textarea>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Tratamiento Sugerido</label>
                                    <textarea name="tratamiento_sugerido" class="form-control" rows="3" required placeholder="Medicamentos, dosis y duración..."></textarea>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Observaciones Adicionales</label>
                                    <textarea name="observaciones_adicionales" class="form-control" rows="2" placeholder="Notas sobre evolución, alergias o próximos pasos..."></textarea>
                                </div>
                            </div>
                            <div class="mt-4 text-end">
                                <a href="/" class="btn btn-secondary">Regresar al Inicio</a>
                                <button type="submit" class="btn btn-danger">Guardar en Expediente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
