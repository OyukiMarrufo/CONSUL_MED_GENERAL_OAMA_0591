<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - CONSUL-MED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">📊 Módulo: Registro de Pacientes</h4>
                    </div>
                    <div class="card-body">
                        <!-- El action apunta a la ruta de Flask para registrar -->
                        <form action="/pacientes/registrar" method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre Completo</label>
                                    <input type="text" name="nombre" class="form-control" required placeholder="Ej. Ana Karen Garcia">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Nacimiento</label>
                                    <input type="date" name="nacimiento" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Género</label>
                                    <select name="genero" class="form-select" required>
                                        <option value="">Selecciona...</option>
                                        <option value="Femenino">Femenino</option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Teléfono</label>
                                    <input type="tel" name="telefono" class="form-control" required placeholder="555012345">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Tipo de Sangre</label>
                                    <input type="text" name="tipo_sangre" class="form-control" placeholder="Ej. O+">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">CURP</label>
                                    <input type="text" name="curp" class="form-control" placeholder="18 caracteres">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" name="correo" class="form-control" required placeholder="ejemplo@correo.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Domicilio</label>
                                    <input type="text" name="domicilio" class="form-control" placeholder="Calle, Número y Colonia">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Contacto de Emergencia</label>
                                    <input type="text" name="contacto_emergencia" class="form-control" placeholder="Nombre y Teléfono de un familiar">
                                </div>
                            </div>
                            <div class="mt-4 text-end">
                                <a href="/" class="btn btn-secondary">Regresar al Inicio</a>
                                <button type="submit" class="btn btn-primary">Registrar Paciente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
