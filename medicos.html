<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Médico - CONSUL-MED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">👨‍⚕️ Módulo: Personal Médico</h4>
                    </div>
                    <div class="card-body">
                        <form action="/medicos/registrar" method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre del Médico</label>
                                    <input type="text" name="nombre_medico" class="form-control" required placeholder="Dr./Dra. Nombre Apellido">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Cédula Profesional</label>
                                    <input type="text" name="cedula_profesional" class="form-control" required placeholder="Número de cédula">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Especialidad</label>
                                    <input type="text" name="especialidad" class="form-control" required placeholder="Ej. Medicina General, Cardiología">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Turno</label>
                                    <select name="turno" class="form-select" required>
                                        <option value="">Selecciona el turno...</option>
                                        <option value="Matutino">Matutino</option>
                                        <option value="Vespertino">Vespertino</option>
                                        <option value="Nocturno">Nocturno</option>
                                    </select>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Días de Trabajo</label>
                                    <input type="text" name="dias_trabajo" class="form-control" placeholder="Ej. Lunes a Viernes">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" name="correo_electronico" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono de Contacto</label>
                                    <input type="tel" name="telefono" class="form-control" required>
                                </div>
                            </div>
                            <div class="mt-4 text-end">
                                <a href="/" class="btn btn-secondary">Regresar al Inicio</a>
                                <button type="submit" class="btn btn-success">Registrar Médico</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
